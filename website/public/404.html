<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | CleanDownloads</title>
  <meta name="theme-color" content="#FFF6E5">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: #FFF6E5;
      color: #111;
      font: 400 17px/1.55 Inter, system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
    }
    .card-404 {
      border: 3px solid #111;
      border-radius: 24px;
      background: #fff;
      padding: 56px 36px;
      max-width: 580px;
      width: 100%;
      box-shadow: 8px 8px 0 #111;
    }
    .badge {
      display: inline-block;
      border: 2px solid #111;
      border-radius: 999px;
      padding: 6px 16px;
      font: 700 14px 'JetBrains Mono', monospace;
      background: #FF8FD0;
      margin-bottom: 20px;
    }
    h1 {
      margin: 0;
      font: 800 clamp(48px, 8vw, 84px)/1 'Bricolage Grotesque', sans-serif;
      letter-spacing: -0.04em;
    }
    p {
      margin: 18px 0 28px;
      font-size: 18px;
      color: #333;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 2.5px solid #111;
      border-radius: 999px;
      padding: 14px 28px;
      font-weight: 700;
      font-size: 16px;
      background: #D4FF3F;
      color: #111;
      text-decoration: none;
      box-shadow: 4px 4px 0 #111;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 #111;
    }
    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 #111;
    }
  </style>
</head>
<body>
  <div class="card-404">
    <span class="badge">404 ERROR</span>
    <h1>Looks like this file was sorted away.</h1>
    <p>The page or file you are looking for does not exist, was moved, or never landed in Downloads.</p>
    <a class="btn" href="/">Return to CleanDownloads Homepage →</a>
  </div>
</body>
</html>
