ShortDescription: One command. Zero clutter. Smart, safe, and automated Windows Downloads organizer.
Description: |
  CleanDownloads is a lightweight, secure Windows CLI tool designed to keep your Downloads folder organized automatically.
  It moves documents, images, installers, archives, media, and code into clean category folders without deleting user files.
  Features include dry-run preview, undo/rollback history, scheduled automation, duplicate detection, and full privacy (100% offline).
