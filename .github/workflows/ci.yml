name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-security:
    name: Lint & Security Audit
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@0b93645e9dc2c792dd34f771f58a29e834ab1e3a # v5.3.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pip-audit

      - name: Run Ruff Linter
        run: |
          ruff check src/ tests/

      - name: Run Bandit Security Analysis
        run: |
          bandit -r src/ -ll

      - name: Run pip-audit Dependency Vulnerability Scan
        run: |
          pip-audit

  test:
    name: Test (${{ matrix.os }} - Py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@0b93645e9dc2c792dd34f771f58a29e834ab1e3a # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Pytest Suite
        run: |
          pytest tests/ -v

  build-validation:
    name: Executable Build Validation
    needs: [lint-and-security, test]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@0b93645e9dc2c792dd34f771f58a29e834ab1e3a # v5.3.0
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller rich

      - name: Validate Standalone Executable Build
        shell: pwsh
        run: |
          & scripts\build_executable.ps1 -Version "1.0.0"
          if (-not (Test-Path dist\cleandownloads.exe)) {
            throw "Executable was not built"
          }
          & dist\cleandownloads.exe --version
          & dist\cleandownloads.exe --help
