name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-security:
    name: Lint & Security Audit
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit pip-audit

      - name: Run Ruff Linter
        run: |
          ruff check src/ tests/

      - name: Run Bandit Security Analysis
        run: |
          bandit -r src/ -ll

      - name: Run pip-audit Dependency Vulnerability Scan
        run: |
          pip-audit

  test:
    name: Automated Unit & Safety Tests
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Pytest Suite
        run: |
          pytest tests/ -v

  build-validation:
    name: Executable Build Validation
    needs: [lint-and-security, test]
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller rich

      - name: Validate Standalone Executable Build
        shell: pwsh
        run: |
          & scripts\build_executable.ps1 -Version "1.0.0"
          if (-not (Test-Path dist\cleandownloads.exe)) {
            throw "Executable was not built"
          }
          & dist\cleandownloads.exe --version
          & dist\cleandownloads.exe --help
