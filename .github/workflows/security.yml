name: Security & DevSecOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'  # Weekly Sunday audit

permissions:
  contents: read
  security-events: write

jobs:
  security-audit:
    name: Security & Vulnerability Analysis
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Python Audit & Security Tooling
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install ruff bandit pip-audit

    - name: Ruff Code Quality & Static Analysis
      run: |
        ruff check .

    - name: Bandit Security SAST Scanning
      run: |
        bandit -r src -ll -f custom --msg-template "{abspath}:{line}: [{test_id}] {msg} (Severity: {severity}, Confidence: {confidence})"

    - name: Supply-Chain Dependency Audit (pip-audit)
      run: |
        pip-audit

    - name: Windows Filesystem Security & Attack Test Suite
      run: |
        pytest -v tests/test_security_attacks.py tests/test_safety.py tests/test_undo.py

    - name: Full Test Suite Execution
      run: |
        pytest -v

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"

    - name: Install Desktop Dependencies & Build Validation
      run: |
        npm --prefix desktop ci
        npm --prefix desktop run build
