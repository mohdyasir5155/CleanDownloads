name: Bug Report
description: Create a report to help us fix a problem in CleanDownloads
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please check existing issues before submitting.
  - type: input
    id: version
    attributes:
      label: CleanDownloads Version
      description: What version of CleanDownloads are you using? (Run `cleandownloads --version`)
      placeholder: "e.g. 1.0.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What version of Windows are you running?
      options:
        - Windows 11 (x64)
        - Windows 10 (x64)
        - Windows Server 2022+
        - Other (specify below)
    validations:
      required: true
  - type: dropdown
    id: install_method
    attributes:
      label: Installation Method
      options:
        - PowerShell Installer (install.ps1)
        - Inno Setup (.exe)
        - Standalone Executable (cleandownloads.exe)
        - Source (pip install -e .)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed steps explaining how to trigger the issue.
      placeholder: |
        1. Run 'cleandownloads scan'
        2. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Please copy and paste any terminal output or error tracebacks here.
      render: shell
